<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tung Tung Math</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
*{box-sizing:border-box}
:root{box-sizing:border-box;--bg:#eef5f1;--surface:#fff;--ink:#10242a;--muted:#4b6a70;--accent:#d9487f;--line:#c9ddd5;--disp:"Fredoka","Trebuchet MS",system-ui,sans-serif;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e2227;--surface:#16343b;--ink:#e7f3ee;--muted:#9bbcc0;--accent:#f2a7c3;--line:#27494f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e2227;--surface:#16343b;--ink:#e7f3ee;--muted:#9bbcc0;--accent:#f2a7c3;--line:#27494f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#47301a;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1040px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:14px;width:fit-content;padding:10px 26px 10px 10px;border-radius:26px;background:#d99a55;color:#2a1708;border:3px solid #8a5a2b}
.brand img{width:72px;height:72px;border-radius:18px;object-fit:cover;flex:none}
h1{font:700 clamp(1.7rem,6vw,2.5rem)/1.05 var(--disp);margin:0}
.sub{margin:10px 0 0;color:#e9d3b4;max-width:36ch}
input[type=search]{font:inherit;padding:10px 16px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.sbtn{width:98px;height:98px;display:grid;place-items:center;border-radius:26px;background:#d99a55;color:#2a1708;border:3px solid #8a5a2b;padding:0;cursor:pointer}
.menu{position:fixed;top:0;bottom:0;left:0;z-index:4;width:max(41.667vw,260px);background:#c0813f;color:#2a1708;border-right:3px solid #8a5a2b;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto;transform:translateX(-100%);visibility:hidden;transition:transform .3s ease,visibility 0s .3s}
.menu.open{transform:none;visibility:visible;transition:transform .3s ease}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mh h2{font:700 1.5rem var(--disp);margin:0}
#mc{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#d99a55;color:#2a1708;border:2px solid #8a5a2b;cursor:pointer;padding:0}
#scrim{position:fixed;inset:0;z-index:3;background:rgba(6,20,24,.25);opacity:0;pointer-events:none;transition:opacity .3s ease}
#scrim.open{opacity:1;pointer-events:auto}
.res{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.res .art{font-size:2.6rem;border-radius:18px}
.res .ttl{font-size:.9rem}
.menu .empty{color:#2a1708}
.sbtn{transition:transform .25s ease,box-shadow .25s ease}

.sbtn:is(:hover,:focus-visible){transform:scale(1.08);box-shadow:0 10px 22px rgba(0,0,0,.45)}

.menu .chips{margin:14px 0 0}
.menu .chip:not([aria-pressed=true]){background:var(--bg)}
.chip{font:600 .95rem var(--disp);padding:6px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;grid-auto-flow:dense}
.tile{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.art{position:relative;display:grid;place-items:center;aspect-ratio:1;border-radius:22px;font-size:3.6rem;overflow:hidden}
.tile:disabled{cursor:default;opacity:.7}
.ttl{position:absolute;left:0;right:0;bottom:0;padding:30px 10px 10px;font:600 1.05rem/1.2 var(--disp);color:#fff;text-align:center;background:linear-gradient(to top,rgba(8,24,28,.88),rgba(8,24,28,0));opacity:0;transform:translateY(8px);transition:opacity .2s ease,transform .2s ease}
.tile:is(:hover,:focus-visible) .ttl{opacity:1;transform:none}
@media(hover:none){.ttl{opacity:1;transform:none}}
.soon{position:absolute;left:10px;top:10px;font:600 .8rem var(--disp);background:var(--surface);color:var(--ink);padding:2px 10px;border-radius:999px}
.empty{grid-column:1/-1;color:var(--muted)}
.art{transition:transform .25s ease}
.em{display:inline-block;transform-origin:50% 85%}
.tile:is(:hover,:focus-visible) .art{transform:scale(1.05)}
.tile:is(:hover,:focus-visible) .em{animation:var(--a) infinite}
[data-anim=wiggle]{--a:wiggle .7s ease-in-out}
[data-anim=flip]{--a:flip 1.4s ease-in-out}
[data-anim=hop]{--a:hop .8s ease-in-out}
[data-anim=ping]{--a:ping .6s ease-in-out}
[data-anim=climb]{--a:climb .8s ease-in-out}
[data-anim=swing]{--a:swing .7s ease-in-out}
@keyframes wiggle{0%,100%{transform:rotate(-12deg) translateX(-6px)}50%{transform:rotate(12deg) translateX(6px)}}
@keyframes flip{0%{transform:perspective(300px) rotateY(0)}60%,100%{transform:perspective(300px) rotateY(360deg)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.1,.9)}50%{transform:translateY(-16px) scale(.95,1.1)}}
@keyframes ping{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
@keyframes climb{0%,100%{transform:translateY(8px)}50%{transform:translateY(-8px)}}
@keyframes swing{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}}
@media(prefers-reduced-motion:reduce){.em{animation:none!important}.tile:is(:hover,:focus-visible) .art{transform:none}.ttl{transition:none;transform:none}.menu,.menu.open,#scrim,.sbtn,a.brand{transition:none}.sbtn:is(:hover,:focus-visible),a.brand:is(:hover,:focus-visible){transform:none}}
#ov{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:transparent;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
#ov[hidden]{display:none}
.box{box-shadow:0 12px 40px rgba(0,0,0,.45);background:var(--surface);color:var(--ink);border-radius:22px;padding:14px;width:min(100%,420px);max-height:100%;overflow:auto}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar h2{font:700 1.25rem var(--disp);margin:0;flex:1}
#sc{color:var(--muted);font-size:.9rem}
#cl{font:600 .95rem var(--disp);padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.cv{display:block;width:100%;max-width:352px;aspect-ratio:1;margin:0 auto;border-radius:14px;touch-action:none}
.pad{display:flex;justify-content:center;gap:8px;margin-top:12px}
.pad button{width:56px;height:48px;font-size:1.1rem;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{aspect-ratio:1;font-size:2rem;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.card.up{background:var(--surface);border-color:var(--accent)}
.react{display:block;width:100%;height:220px;border-radius:18px;border:0;font:600 1.3rem var(--disp);color:#10242a;background:#cfe3e8;cursor:pointer;padding:16px}
.react.wait{background:#f4a261}
.react.go{background:#9bc53d}
.gplay{position:absolute;inset:0}
.gplay .mem{position:absolute;inset:0;padding:14px;gap:10px;grid-template-rows:repeat(4,1fr)}
.gplay .card{aspect-ratio:auto;font-size:clamp(2rem,10vh,5rem);background:#3a2312;border-color:#8a5a2b;color:#2a1708}
.gplay .card.up{background:#f3e3cc;border-color:#d99a55}
.gplay .react{position:absolute;inset:0;width:100%;height:100%;border-radius:0;font-size:clamp(1.4rem,4vw,2.4rem)}
.gscore{font-weight:500}
.gfs{margin-left:auto;display:grid;place-items:center;width:38px;height:38px;border-radius:10px;border:2px solid #8a5a2b;background:transparent;color:#2a1708;cursor:pointer;padding:0}
.gfs:hover{background:rgba(42,23,8,.14)}
.gamebox.fs{position:fixed;inset:0;z-index:15;width:100%;min-width:0;height:100%;margin:0;border-radius:0;border:0}
.gamebox:fullscreen{border-radius:0;border:0}
.gamebox.fs>.gbar,.gamebox:fullscreen>.gbar{display:none}
.gx{display:none;position:absolute;top:12px;right:12px;z-index:2;width:40px;height:40px;place-items:center;border-radius:50%;border:2px solid rgba(243,227,204,.6);background:rgba(26,15,7,.55);color:#f3e3cc;cursor:pointer;padding:0}
.gamebox.fs .gx{display:grid}
[hidden]{display:none!important}
a.brand{text-decoration:none;transition:transform .25s ease,box-shadow .25s ease}
a.brand:is(:hover,:focus-visible){transform:scale(1.03);box-shadow:0 6px 14px rgba(0,0,0,.35)}
.gp main{max-width:1200px}
.locked>main,.locked>aside,.locked>#scrim{display:none!important}
#gate{display:none}
.locked #gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#3a2312}
.gcard{width:min(100%,380px);padding:26px;border-radius:26px;background:#d99a55;color:#2a1708;border:3px solid #8a5a2b;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.glink{font:600 .95rem var(--disp);padding:4px 14px;border-radius:999px;border:2px solid #8a5a2b;background:transparent;color:#2a1708;cursor:pointer}
#gowner{display:none;flex-direction:column;align-items:center;gap:12px;width:100%}
.gcard.own>label[for=gpw],.gcard.own>#gpw,.gcard.own>#gerr,.gcard.own>#gbtn,.gcard.own>#gown{display:none}
.gcard.own #gowner{display:flex}
.gcard img{width:96px;height:96px;border-radius:22px;object-fit:cover}
.gcard h2{font:700 1.8rem/1.1 var(--disp);margin:0}
.gcard label{font-weight:600}
#gpw,#gopw{font:inherit;width:100%;padding:10px 16px;border-radius:999px;border:2px solid #8a5a2b;background:#fff7ec;color:#2a1708}
#gerr,#gomsg{min-height:1.4em;margin:0;font-weight:600;overflow-wrap:anywhere}
#gbtn,#gok{font:600 1.05rem var(--disp);padding:10px 28px;border-radius:999px;border:0;background:#2a1708;color:#f3e3cc;cursor:pointer}
.em.pic{position:absolute;inset:0}
.em.pic img{display:block;width:100%;height:100%;object-fit:cover}
.gamebox{width:0;min-width:min(200%,calc(100vw - 32px));height:clamp(440px,70vh,680px);margin-top:20px;display:flex;flex-direction:column;border:3px solid #8a5a2b;border-radius:26px;background:#1a0f07;overflow:hidden}
.gstage{flex:1;min-height:0;position:relative;display:grid;place-items:center}
.gnote{margin:0;padding:0 16px;text-align:center;color:#c9a97c}
.gstage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#1a0f07}
.gstage iframe:not([src]){display:none}
.gbar{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 20px;background:#d99a55;color:#2a1708;border-top:3px solid #8a5a2b;font:600 1.05rem var(--disp)}
</style>
</head>
<body class="locked">
<div id="gate" role="dialog" aria-modal="true" aria-label="Password">
  <div class="gcard">
    <img id="glogo" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
    <h2>Tung Tung Math</h2>
    <label for="gpw">Enter the password</label>
    <input id="gpw" type="password" autocomplete="off">
    <p id="gerr" role="alert"></p>
    <button id="gbtn">Enter</button>
    <button id="gown" class="glink">Owner</button>
    <div id="gowner">
      <label for="gopw">PC password?</label>
      <input id="gopw" type="password" autocomplete="off">
      <p id="gomsg" role="alert"></p>
      <button id="gok">Show password</button>
      <button id="gback" class="glink">Back</button>
    </div>
  </div>
</div>

function memory(st, setScore) {

  const cards = [...E, ...E].sort(() => Math.random() - .5);
  let open = [], moves = 0, pairs = 0, lock = false, timer;
  const grid = document.createElement('div'); grid.className = 'mem';
  const hide = b => { b.classList.remove('up'); b.textContent = ''; b.setAttribute('aria-label', 'Hidden card'); };
  cards.forEach(e => {
    const b = document.createElement('button'); b.className = 'card'; b.dataset.e = e; b.setAttribute('aria-label', 'Hidden card');
    b.onclick = () => {
      if (lock || b.classList.contains('up')) return;
      b.classList.add('up'); b.textContent = e; b.setAttribute('aria-label', e); open.push(b);
      if (open.length < 2) return;
      moves++; setScore(moves + ' moves');
      if (open[0].dataset.e == open[1].dataset.e) { open = []; if (++pairs == 8) setScore('Cleared in ' + moves + ' moves'); }
      else { lock = true; timer = setTimeout(() => { open.forEach(hide); open = []; lock = false; }, 700); }
    };
    grid.append(b);
  });
  st.append(grid); setScore('0 moves');
  return () => clearTimeout(timer);
}

function reaction(st, setScore) {
  const b = document.createElement('button'); b.className = 'react'; b.textContent = 'Tap to start'; st.append(b);
  let state = 0, t0, to;
  const set = (cls, txt) => { b.className = 'react ' + cls; b.textContent = txt; };
  b.onclick = () => {
    if (state == 0) {
      state = 1; set('wait', 'Wait for green…');
      to = setTimeout(() => { state = 2; set('go', 'Tap now!'); t0 = performance.now(); }, 1000 + Math.random() * 2500);
    } else if (state == 1) {
      clearTimeout(to); state = 0; set('', 'Too soon. Tap to try again.');
    } else {
      const ms = Math.round(performance.now() - t0); state = 0; set('', ms + ' ms. Tap to go again.'); setScore(ms + ' ms');
    }
  };
  return () => clearTimeout(to);
}

/* ---------- Game list: add a game with one entry. "href" gives it its own page, "play" runs a built-in game on that page, "src" is the address for that page's iframe, and an entry with none of these is a Coming soon tile ---------- */
const GAMES = [
  { id: 'eagle', title: 'Eagle Craft', cat: 'Sandbox', emoji: '', color: '#fff', img: EAGLE_IMG, href: '#eagle-craft', src:'eaglercraft-26.2.html' },
  { id: 'football', title: 'Football Bros', cat: 'Sports', emoji: '', color: '#fff', img: FOOTBALL_IMG, href: '#football-bros' },
  { id: 'memory', title: 'Pond Pairs', cat: 'Puzzle', emoji: '🪷', color: '#f2a7c3', anim: 'flip', href: '#pond-pairs', play: memory },
  { id: 'reaction', title: 'Frog Reflex', cat: 'Skill', emoji: '🐸', color: '#ffd166', anim: 'hop', href: '#frog-reflex', play: reaction },
  { id: 'pong', title: 'Pad Pong', cat: 'Arcade', emoji: '🏓', color: '#8fd3d9', anim: 'ping' },
  { id: 'ladder', title: 'Word Ladder', cat: 'Puzzle', emoji: '🪜', color: '#c3b1e1', anim: 'climb' },
  { id: 'golf', title: 'Tiny Golf', cat: 'Skill', emoji: '⛳', color: '#f4a261', anim: 'swing' }
];
const CATS = ['Arcade', 'Puzzle', 'Sandbox', 'Skill', 'Sports'];

/* ---------- Page ---------- */
const $ = s => document.querySelector(s);
let cat = '', q = '', cleanup = null;

function show(grid, list, none) {
  
  
  if (!list.length) { grid.innerHTML = '<p class="empty">' + none + '</p>'; return; }
  grid.innerHTML = list.map(g =>
    '<button class="tile' + (g.feat ? ' feat' : '') + '" data-id="' + g.id + '" data-anim="' + (g.anim || '') + '"' + (g.play || g.href ? '' : ' disabled') + '>' +
    '<span class="art" style="background:' + g.color + '"><span class="em' + (g.img ? ' pic' : '') + '" aria-hidden="true">' + (g.img ? '<img src="' + g.img + '" alt="">' : g.emoji) + '</span>' +
    (g.play || g.href ? '' : '<span class="soon">Coming soon</span>') + '<span class="ttl">' + g.title + '</span></span>' +
    '</button>'
  ).join('');
}

function render() {
  const on = cat || q;
  show($('#res'), on ? GAMES.filter(g => (!cat || g.cat == cat) && g.title.toLowerCase().includes(q)) : [],
    on ? 'No games match. Try a different search or genre.' : 'Type a name or pick a genre to see games here.');
}
show($('#grid'), GAMES, '');
$('#chips').innerHTML = CATS.map(c => '<button class="chip" aria-pressed="' + (c == cat) + '">' + c + '</button>').join('');
$('#chips').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  cat = cat == b.textContent ? '' : b.textContent;
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x.textContent == cat));
  render();
};
$('#q').oninput = e => { q = e.target.value.trim().toLowerCase(); render(); };
function setMenu(on) {
  $('#menu').classList.toggle('open', on); $('#scrim').classList.toggle('open', on);
  $('#sb').setAttribute('aria-expanded', on);
  (on ? $('#q') : $('#sb')).focus();
}
$('#sb').onclick = () => setMenu(true);
$('#mc').onclick = () => setMenu(false);
$('#scrim').onclick = () => setMenu(false);
const tileClick = e => {
  const t = e.target.closest('.tile'); if (!t || t.disabled) return;
  const g = GAMES.find(x => x.id == t.dataset.id);
  setMenu(false); location.hash = g.href;
};
$('#grid').onclick = $('#res').onclick = tileClick;
addEventListener('keydown', e => {
  if (e.key != 'Escape') return;
  document.querySelectorAll('.gamebox.fs').forEach(p => p.classList.remove('fs'));
  if ($('#menu').classList.contains('open')) setMenu(false);
});
/* ---------- Password gate: a light lock only. The page stores a fingerprint of the password, not the password itself, but anyone who looks at the page source can still get around it ---------- */
const PW_HASH = 'daff948977d3f53f3b5c46e2a4dc95960ac1452a3e6bb67c4b1c42d2bbc6fff9';
async function sha(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
$('#glogo').src = document.querySelector('.brand img').src;
async function tryGate() {
  if (await sha($('#gpw').value.trim()) == PW_HASH) {
    
    document.body.classList.remove('locked'); route();
  } else {
    $('#gerr').textContent = 'That isn’t the password. Try again.';
    $('#gpw').select();
  }
}
$('#gbtn').onclick = tryGate;
$('#gpw').onkeydown = e => { if (e.key == 'Enter') tryGate(); };
if (document.body.classList.contains('locked')) $('#gpw').focus();

/* Owner button: the site password is stored encrypted with the owner (PC) password, so neither one appears in the page as plain text */
const OWNER_BLOB = '7wGR0vQM3HwdzpP3nIagToRkAATh96jtXXNB56VcJojLA8xdya4rUQ98B+SIwzc5gSsFWUE=';
async function ownerReveal(pw) {
  const raw = Uint8Array.from(atob(OWNER_BLOB), c => c.charCodeAt(0));
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: raw.slice(0, 16), iterations: 200000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(16, 28) }, key, raw.slice(28)));
}
async function ownerTry() {
  try { $('#gomsg').textContent = 'The password is ' + await ownerReveal($('#gopw').value); }
  catch (e) { $('#gomsg').textContent = 'That isn’t the PC password.'; $('#gopw').select(); }
}
$('#gown').onclick = () => { $('.gcard').classList.add('own'); $('#gopw').focus(); };
$('#gback').onclick = () => { $('.gcard').classList.remove('own'); $('#gopw').value = ''; $('#gomsg').textContent = ''; $('#gpw').focus(); };
$('#gok').onclick = ownerTry;
$('#gopw').onkeydown = e => { if (e.key == 'Enter') ownerTry(); };

const FS_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const X_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function toggleFs(p) {
  if (document.fullscreenElement || p.classList.contains('fs')) {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    p.classList.remove('fs'); return;
  }
  Promise.resolve(p.requestFullscreen ? p.requestFullscreen() : Promise.reject()).catch(() => p.classList.add('fs'));
}
/* every game with an href gets its own page; an iframe address goes in that game's "src" */
GAMES.filter(g => g.href).forEach(g => {
  const p = document.createElement('section');
  p.className = 'gamebox'; p.id = 'page-' + g.id; p.hidden = true; p.setAttribute('aria-label', g.title);
  p.innerHTML = '<div class="gstage">' + (g.play ? '' : '<p class="gnote">The game will appear here.</p><iframe title="' + g.title + ' game" allowfullscreen></iframe>') + '</div>' +
    '<div class="gbar"><span class="gname">' + g.title + '</span><span class="gscore"></span><button class="gfs" aria-label="Fullscreen">' + FS_ICON + '</button></div><button class="gx" aria-label="Exit fullscreen">' + X_ICON + '</button>';
  $('#pages').append(p);
  const f = p.querySelector('iframe'); if (f && g.src) f.dataset.src = g.src;
  p.querySelector('.gfs').onclick = () => toggleFs(p);
  p.querySelector('.gx').onclick = () => toggleFs(p);
});
function route() {
  const g = GAMES.find(x => x.href && x.href == location.hash);
  const open = !document.body.classList.contains('locked');
  if (cleanup) { cleanup(); cleanup = null; }
  document.querySelectorAll('.gplay').forEach(n => n.remove());
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  document.querySelectorAll('.gamebox').forEach(p => {
    const on = !!g && open && p.id == 'page-' + g.id;
    p.hidden = !on; p.classList.remove('fs');
    p.querySelector('.gscore').textContent = '';
    const f = p.querySelector('iframe');
    if (f) { if (on && f.dataset.src) f.src = f.dataset.src; else if (f.hasAttribute('src')) f.src = 'about:blank'; }
  });
  $('#grid').hidden = !!g; document.body.classList.toggle('gp', !!g);
  if (g && open && g.play) {
    const p = $('#page-' + g.id), mount = document.createElement('div');
    mount.className = 'gplay'; p.querySelector('.gstage').append(mount);
    cleanup = g.play(mount, v => { p.querySelector('.gscore').textContent = v; });
  }
  document.title = g ? g.title + ' | Tung Tung Math' : 'Tung Tung Math';
  scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
render();
</script>
</body>
